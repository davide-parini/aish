# GitHub Actions workflow to automatically release aish using GoReleaser
# This workflow runs whenever you push a git tag (e.g., v1.0.0)
name: goreleaser

# Trigger: runs when you push a tag to GitHub
# Example: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - '*'  # Matches any tag (v1.0.0, v2.1.3, etc.)

# Permissions needed for this workflow
# "contents: write" allows the action to create GitHub Releases and upload assets
permissions:
  contents: write

jobs:
  goreleaser:
    # Run on Ubuntu (fastest and cheapest GitHub Actions runner)
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out your repository code
      # This downloads your code so the workflow can build it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 downloads the entire git history
          # GoReleaser needs this to generate changelogs from commits
          fetch-depth: 0
      
      # Step 2: Install Go
      # Sets up the Go programming language so we can build the binary
      # Uses Go 1.25 (minimum required version, consistent with go.mod)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'  # Pinned to match go.mod and README requirements
      
      # Step 3: Run GoReleaser
      # This does all the heavy lifting:
      # - Compiles binaries for different OS/architectures
      # - Creates archives (.tar.gz files)
      # - Generates checksums
      # - Creates a GitHub Release with all the files
      # - Updates your Homebrew tap with the new formula
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser  # Use the official GoReleaser distribution
          version: latest           # Use the latest version of GoReleaser
          args: release --clean     # "--clean" removes old build artifacts first
        env:
          # GITHUB_TOKEN: Automatically provided by GitHub Actions
          # Used to create the GitHub Release and upload files
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # TAP_GITHUB_TOKEN: Your personal access token (set in repo secrets)
          # Used to push the Homebrew formula to your homebrew-aish repository
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
